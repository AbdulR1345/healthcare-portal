services:
  - type: web
    name: healthcare-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: CLIENT_URL
        sync: false
      - key: CLINIC_TIME_ZONE
        value: UTC
      - key: AI_SERVICE_URL
        fromService:
          name: healthcare-ai
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: AI_SERVICE_TOKEN
        fromService:
          name: healthcare-ai
          type: web
          envVarKey: AI_SERVICE_TOKEN
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MEDICAL_STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: S3_PREFIX
        value: medical-documents

  - type: web
    name: healthcare-ai
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_SERVICE_TOKEN
        generateValue: true
      - key: LLM_MODEL
        value: gpt-4o-mini

  - type: pserv
    name: healthcare-db
    runtime: postgres
    plan: free
    databaseName: healthcare_portal
    user: healthcare
